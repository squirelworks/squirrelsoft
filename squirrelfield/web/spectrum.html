<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <title>Spectrum — SquirrelField</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none">Squirrel<span>Field</span></a></div>
    <nav class="nav">
      <a href="spectrum.html">Spectrum</a>
      <a href="qr.html">QR</a>
      <a href="suica.html">Suica</a>
    </nav>
  </header>
  <main>
    <h1>Live spectrum</h1>
    <p class="lead">Realtime microphone analyzer with spectrum trace and scrolling waterfall. Pinch horizontally to zoom frequency.</p>
    <div class="toolbar">
      <button class="primary" id="btnStart">Start mic</button>
      <button id="btnStop" disabled>Stop</button>
      <button id="btnHold">Max-hold</button>
      <button id="btnReset">Reset hold</button>
      <label class="inline">FFT
        <select id="fftSize">
          <option>1024</option>
          <option selected>2048</option>
          <option>4096</option>
          <option>8192</option>
        </select>
      </label>
      <label class="inline">Demo tone
        <input type="checkbox" id="demoTone" />
      </label>
    </div>
    <div class="stage">
      <canvas id="viz" width="900" height="640"></canvas>
    </div>
    <div class="status" id="status">Idle — tap Start mic (HTTPS/localhost required).</div>
  </main>
  <script src="spectrum.js"></script>
</body>
</html>
