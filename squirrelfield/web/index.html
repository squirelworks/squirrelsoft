<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <title>SquirrelField — QR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">Squirrel<span>Field</span></div>
    <nav class="nav">
      <a href="index.html">QR</a>
    </nav>
  </header>
  <main>
    <h1>QR reader</h1>
    <p class="lead">Field camera QR / barcode scanner. Spectrum lives in SquirrelSound; FeliCa in SquirrelSuica.</p>
    <div class="toolbar">
      <button class="primary" id="btnStart">Start camera</button>
      <button id="btnStop" disabled>Stop</button>
      <button id="btnCopy" disabled>Copy</button>
      <label class="inline">Facing
        <select id="facing">
          <option value="environment" selected>Back</option>
          <option value="user">Front</option>
        </select>
      </label>
      <label class="inline">Image
        <input type="file" id="file" accept="image/*" capture="environment" />
      </label>
    </div>
    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
    </div>
    <div class="panel">
      <h3>Last result</h3>
      <div class="mono" id="result">(none yet)</div>
    </div>
    <div class="status" id="status">Idle.</div>
  </main>
  <script src="qr.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
