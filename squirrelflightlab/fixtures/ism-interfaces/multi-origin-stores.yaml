citations:
  - id: mil-a-8591-table
    title: "MIL-A-8591 / store suspension lug spacing table (public PDF mirror)"
    url: "https://www.dror-aero.com/link/mil/mil-std-8591.pdf"
    used_for: "14 in and 30 in lug spacing by weight class; cites MIL-STD-1760 as electrical interconnection standard"
  - id: mil-r-85325
    title: "MIL-R-85325 lug spacing excerpts (public)"
    url: "https://mil-spec.tpub.com/MIL-R/MIL-R-85325/MIL-R-8532500006.htm"
    used_for: "14 in (355.6 mm) and 30 in (762 mm) lug spacing examples"
  - id: wiki-aim120
    title: "AIM-120 AMRAAM (encyclopedia summary)"
    url: "https://en.wikipedia.org/wiki/AIM-120_AMRAAM"
    used_for: "order-of-magnitude length/diameter/mass for inert class"
  - id: wiki-r73
    title: "R-73 (missile) (encyclopedia summary)"
    url: "https://en.wikipedia.org/wiki/R-73_(missile)"
    used_for: "order-of-magnitude length/diameter/mass for RU AAM-class inert"
  - id: wiki-pl15
    title: "PL-15 (encyclopedia summary)"
    url: "https://en.wikipedia.org/wiki/PL-15"
    used_for: "order-of-magnitude length/mass for CN BVR-class inert"
  - id: wiki-aam4
    title: "AAM-4 (encyclopedia summary)"
    url: "https://en.wikipedia.org/wiki/AAM-4"
    used_for: "order-of-magnitude length/mass for JP BVR-class inert"
  - id: wiki-mil1760
    title: "MIL-STD-1760 (encyclopedia summary)"
    url: "https://en.wikipedia.org/wiki/MIL-STD-1760"
    used_for: "existence of aircraft/store electrical interconnection standard class"

mechanical_interfaces:
  - id: ism_native_80mm
    family: ISM
    type: pylon_lugs
    lug_spacing_mm: 80
    note: "ISM study native spacing from hardpoints.yaml"
  - id: nato_14in
    family: NATO
    type: suspension_lugs
    lug_spacing_in: 14
    lug_spacing_mm: 355.6
    citation_ids: [mil-a-8591-table, mil-r-85325]
  - id: nato_30in
    family: NATO
    type: suspension_lugs
    lug_spacing_in: 30
    lug_spacing_mm: 762.0
    citation_ids: [mil-a-8591-table, mil-r-85325]
  - id: ru_apu_rail
    family: RU
    type: rail_launcher_class
    note: "Generic APU-class rail abstraction; public naming only"
  - id: ru_aku_ejector
    family: RU
    type: ejector_rack_class
    note: "Generic AKU-class ejector abstraction; public naming only"
  - id: cn_pylon_adapter
    family: CN
    type: adapter_pylon
    adapts_to: [nato_14in, rail_or_cn_native_stub]
  - id: jp_pylon_adapter
    family: JP
    type: adapter_pylon
    adapts_to: [nato_14in, rail_or_jp_native_stub]

electrical_layers:
  - id: elec_ism_native
    family: ISM
    categories: [power_28vdc, release_discrete, safe_arm_discrete, ism_bus_serial]
    protocol_internals: false
  - id: elec_mil_std_1760_class
    family: NATO
    categories: [power, release_discrete, multipurpose_data_port]
    standard_class: MIL-STD-1760
    citation_ids: [wiki-mil1760, mil-a-8591-table]
    protocol_internals: false
    note: "Category-level only; no signal timing or message specs in-repo"
  - id: elec_adapter_ru
    family: RU
    categories: [power, release_discrete, safe_discrete, serial_stub]
    protocol_internals: false
  - id: elec_adapter_cn
    family: CN
    categories: [power, release_discrete, safe_discrete, serial_stub]
    protocol_internals: false
  - id: elec_adapter_jp
    family: JP
    categories: [power, release_discrete, safe_discrete, serial_stub]
    protocol_internals: false

