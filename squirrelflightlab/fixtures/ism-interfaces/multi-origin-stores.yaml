# family × station × adapters
compatibility_matrix:
  - family: ISM
    stations: [STA-1, STA-2, STA-3, STA-4, STA-5, STA-6, STA-7, STA-8, STA-9]
    mechanical: [ism_native_80mm]
    electrical: [elec_ism_native]
    stores: [ISM-INERT-AAM-S, ISM-INERT-AGM-M, ISM-INERT-FUEL-600]
  - family: NATO
    stations: [STA-3, STA-4, STA-5, STA-6, STA-7, STA-8, STA-9]
    mechanical: [nato_14in, nato_30in]
    electrical: [elec_mil_std_1760_class]
    stores: [ISM-INERT-AAM-M]
    notes: "STA-1/2 tip rails remain ISM/RU rail class; heavy 30in on STA-7…9 only"
  - family: RU
    stations: [STA-1, STA-2, STA-3, STA-4, STA-5, STA-6]
    mechanical: [ru_apu_rail, ru_aku_ejector]
    electrical: [elec_adapter_ru]
    stores: [ISM-INERT-RU-AAM-S]
  - family: CN
    stations: [STA-3, STA-4, STA-5, STA-6, STA-7, STA-8]
    mechanical: [cn_pylon_adapter]
    electrical: [elec_adapter_cn]
    stores: [ISM-INERT-CN-AAM-L]
  - family: JP
    stations: [STA-3, STA-4, STA-5, STA-6, STA-7, STA-8]
    mechanical: [jp_pylon_adapter]
    electrical: [elec_adapter_jp]
    stores: [ISM-INERT-JP-AAM-M]

