  - id: raymer-ads
    title: "Aircraft Design: A Conceptual Approach (Raymer) — public textbook sizing heuristics"
    note: "Empty-weight fraction, T/W, wing loading, fuel fraction class bands for fighters"
    kind: textbook
  - id: roskam-I
    title: "Airplane Design Part I (Roskam) — public textbook preliminary sizing"
    note: "Weight fractions, wing loading, T/W statistical ranges"
    kind: textbook
  - id: survey-99
    title: "ISM comparative fighter survey (#99)"
    path: fighter-jet/docs/research/comparative-fighter-survey.md
    note: "Rafale/Typhoon/Flanker-class qualitative spread"
  - id: eurofighter-features
    title: "Eurofighter Typhoon Features (public)"
    url: "https://www.eurofighter.com/the-aircraft/features"
    used_for: "Twin ~90 kN class thrust; +9 g class claims"
  - id: dassault-rafale-2023
    title: "Rafale Paris Air Show 2023 press release"
    url: "https://www.dassault-aviation.com/wp-content/blogs.dir/2/files/2023/06/RAFALE-Press-Release-Paris-Air-Show-2023.pdf"
