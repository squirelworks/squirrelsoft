class_comparison_bands:
  # Bands for modern twin multirole / air-superiority class (public + textbook)
  empty_weight_fraction:
    # We/W0
    min: 0.45
    max: 0.65
    citation_ids: [raymer-ads, roskam-I, wiki-typhoon]
  thrust_to_weight_mtow_reheat:
    min: 0.75
    max: 1.20
    citation_ids: [raymer-ads, eurofighter-features]
  wing_loading_mtow_pa:
    # N/m²
    min: 3500
    max: 6500
    citation_ids: [raymer-ads, roskam-I]
  fuel_fraction:
    # Wf/W0 internal
    min: 0.18
    max: 0.35
    citation_ids: [raymer-ads, roskam-I]
  combat_radius_km:
    min: 500
    max: 1500
    citation_ids: [survey-99, dassault-rafale-2023]
  max_nz_g:
    min: 7.0
    max: 9.5
    citation_ids: [eurofighter-features, raymer-ads]
  cg_travel_pct_mac:
    min: 0.0
    max: 15.0
    citation_ids: [raymer-ads]
  static_margin_pct_mac:
    min: 3.0
    max: 15.0
    citation_ids: [raymer-ads, roskam-I]
  empty_mass_kg_class:
    min: 8000
    max: 14000
    citation_ids: [wiki-typhoon, survey-99]
  mtow_kg_class:
    min: 15000
    max: 25000
    citation_ids: [wiki-typhoon, survey-99]

gates:
  - id: G-WE-FRAC
    name: empty_weight_fraction
    formula: "empty_mass / mtow"
    our_value: 0.530  # 9800/18500
    band_ref: empty_weight_fraction
    unit: "1"
    result: pass
    citation_ids: [raymer-ads, roskam-I, mass-properties]

  - id: G-TW-MTOW
    name: thrust_to_weight_mtow_reheat
    formula: "thrust_sl_reheat_total / (mtow * g)"
    our_value: 0.992  # 180e3/(18500*9.81)
    band_ref: thrust_to_weight_mtow_reheat
    unit: "1"
    result: pass
    citation_ids: [raymer-ads, eurofighter-features]

  - id: G-WING-LOAD
    name: wing_loading_mtow
    formula: "(mtow * g) / S"
    our_value: 6154  # Pa
    band_ref: wing_loading_mtow_pa
    unit: Pa
    result: pass
    citation_ids: [raymer-ads, roskam-I]
    note: "Near upper band — monitor when full-scale S freezes"

  - id: G-FUEL-FRAC
    name: fuel_fraction_internal
    formula: "fuel_internal / mtow"
    our_value: 0.227
    band_ref: fuel_fraction
    unit: "1"
    result: pass
    citation_ids: [raymer-ads, roskam-I, mass-properties]

  - id: G-RADIUS
    name: combat_radius_assumption
    our_value: 900
    band_ref: combat_radius_km
    unit: km
    result: provisional_pass
    citation_ids: [survey-99]
    note: "Mission stub until aero DB / Breguet check closes"

  - id: G-BREGUET
    name: breguet_range_sanity
    description: >
      Cruise Breguet check: R ≈ (V/c) * (L/D) * ln(Wi/Wf). Gate fails if implied
      L/D or SFC outside fighter-cruise heuristics for assumed radius.
    assumed_v_mps: 250
    assumed_ld: 8.0
    assumed_sfc_per_s: 0.000025  # ~0.9 /hr class crude
    implied_range_km: 2100
    combat_radius_fraction_of_ferry: 0.43
    band_ld: {min: 6.0, max: 12.0}
    result: provisional_pass
    citation_ids: [raymer-ads, roskam-I]
    note: "Crude; Steve replaces with Flight Lab aero"

  - id: G-NZ
    name: max_nz
    our_value: 9.0
    band_ref: max_nz_g
    unit: g
    result: pass
    citation_ids: [eurofighter-features, raymer-ads]

  - id: G-CG
    name: cg_travel_fs
    our_value_fs_pct_range: [0.52, 0.62]
    approx_pct_mac: 10.0
    band_ref: cg_travel_pct_mac
    result: pass
    citation_ids: [raymer-ads, mass-properties]

  - id: G-SM
    name: static_margin
    our_value_pct_mac: 5.0
    band_ref: static_margin_pct_mac
    result: provisional_pass
    citation_ids: [raymer-ads, roskam-I]
    note: "Pending AVL neutral-point run"

  - id: G-STRUCT-MARGIN
    name: structural_limit_load_factor
    description: "Design limit ≥ envelope nz; ultimate ≥ 1.5 * limit (textbook)"
    limit_load_factor_g: 9.0
    ultimate_factor: 1.5
    our_ultimate_g: 13.5
    result: pass
    citation_ids: [raymer-ads]
    carrier_override: "Arrestment/catapult cases in carrier-loads.yaml govern local fitting allowables"

  - id: G-MASS-CLASS
    name: empty_and_mtow_class
    our_empty_kg: 9800
    our_mtow_kg: 18500
    band_empty_ref: empty_mass_kg_class
    band_mtow_ref: mtow_kg_class
    result: pass
    citation_ids: [wiki-typhoon, survey-99, mass-properties]

