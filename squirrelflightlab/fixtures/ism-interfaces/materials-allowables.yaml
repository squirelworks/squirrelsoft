# Preliminary composite stack-ups (study; fiber areal weight TBD).
stackups:
  - id: wing_skin_qi
    material: ISM-CFRP-A
    layup: "[0/45/90/-45]s"
    thickness_mm_study: 2.0
    zones: [wing_skins]
  - id: spar_web_shear
    material: ISM-CFRP-A
    layup: "[45/-45]ns"
    thickness_mm_study: 3.0
    zones: [wing_spar_webs_ribs]
  - id: surface_sandwich
    material: ISM-CFRP-A
    facesheet_layup: "[0/45/90/-45]"
    core: honeycomb_or_foam_tbd
    zones: [empennage_skins, control_surfaces]

joints_matrix:
  - join: bonded
    allowed_for: [CFRP_skins_to_cores, fairings, radome_attach_ring]
    forbidden_for: [primary_gear_fittings, arresting_hook]
    rationale: continuous_load_and_seal
  - join: bolted
    allowed_for: [fittings, gear, hook, access_panels, spar_root, carry_through]
    fastener_family: Ti_or_CRES
    rationale: replaceable_lru_high_peak_loads
  - join: riveted
    allowed_for: [Al_skins_longerons, secondary_structure]
    fastener_family: Al_or_CRES_rivets
    rationale: established_al_airframe_practice
  - join: hybrid_bond_bolt
    allowed_for: [CFRP_to_Al_splices]
    rationale: peek_load_share_plus_fail_safe

galvanic_rules:
  - pair: CFRP_Al
    required: [glass_isolation_ply_or_primer, sealant, Ti_or_CRES_fasteners]
    forbidden: [bare_Al_washer_on_carbon]
  - pair: CFRP_Ti
    required: [sealant_optional]
    note: preferred_dissimilar_pair
  - pair: Al_Steel
    required: [primer_sealant, drain_paths]
  - pair: Ti_Steel
    required: [sealant]

environment:
  temperature_avionics_bay_c: [-40, 70]
  temperature_aft_hot_c_max: 300
  moisture: marine_carrier_deck
  corrosion_controls: [primer_system, sealant, drain_paths, filiform_mitigation]

prototype_vs_production:
  - zone: wing_spar_caps
    prototype: ISM-Al-7xxx
    production_option: ISM-Al-Li
    reason: cost_then_mass
  - zone: landing_gear
    prototype: ISM-Ti-6
    production_cost_alternate: ISM-Steel-HS
    reason: ti_preferred_naval; steel_needs_heavy_coat
  - zone: forward_fuselage_skins
    prototype: ISM-Al-2xxx_sheet
    production_option: ISM-CFRP-A_panels
    reason: repairability_vs_mass
  - zone: study_shell
    prototype: printed_or_machined_soft_tooling
    production: certified_mill_product_per_manufacturing_yaml
    note: OpenSCAD study scale ×36.9 for full-scale

knockdown_factors_provisional:
  riveted_joint_efficiency: 0.75
  bolted_fitting_bearing: 0.67
  cfrp_bvid_residual_strength: 0.80
  hot_wet_cfrp: 0.85

expected_behaviour:
  flight_lab_may_use_ftu_fty_for_sanity_gates: true
  not_for_flight_release: true
