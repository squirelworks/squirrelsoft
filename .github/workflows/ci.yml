# Build and test on every push to main and every pull request.
# Debug builds only: no signing secrets and no release bundles. This workflow
# must never build or upload .aab files or publish anything. AABs never go to
# GitHub, and Play uploads are done by the owner by hand.
#
# Host `make test` runs on ubuntu-latest, windows-latest and macos-latest (S4).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: make test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            host: linux
          - os: macos-latest
            shell: bash
            host: macos
          - os: windows-latest
            shell: msys2 {0}
            host: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        if: matrix.host == 'windows'
        with:
          # UCRT64: mingw64 dropped libusb; MINGW64 itself is deprecated.
          msystem: UCRT64
          update: true
          install: >-
            make zip git python diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libusb

      - name: Host dependencies (Linux / macOS)
        if: matrix.host != 'windows'
        run: bash scripts/release/ci_host_deps.sh ${{ matrix.host }}
      - uses: actions/setup-python@v5
        if: matrix.host != 'windows'
        with:
          python-version: "3.12"
      - name: Start pcscd with the virtual reader (Linux)
        if: matrix.host == 'linux'
        run: |
          sudo systemctl stop pcscd.socket pcscd.service || true
          sudo pcscd --disable-polkit
      - name: make test
        env:
          REQUIRE_LOOPBACK: ${{ matrix.host == 'linux' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.host }}" = linux ]; then
            make test PCSC_TEST_FLAGS=--require
          else
            make test
          fi

  android:
    name: Android ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [squirrelsound, squirrelsuica, squirrelsuica-analysis, squirrelqr]
    defaults:
      run:
        working-directory: ${{ matrix.app }}/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.app }}
          path: ${{ matrix.app }}/android/app/build/reports/tests/
          retention-days: 7
