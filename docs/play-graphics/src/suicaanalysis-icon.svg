    <g fill="#00A040">
      <rect x="150" y="162" width="44" height="18" rx="3"/><rect x="202" y="162" width="44" height="18" rx="3"/><rect x="254" y="162" width="44" height="18" rx="3"/><rect x="306" y="162" width="44" height="18" rx="3"/><rect x="358" y="162" width="44" height="18" rx="3"/>
      <rect x="150" y="196" width="44" height="18" rx="3"/><rect x="202" y="196" width="44" height="18" rx="3"/><rect x="254" y="196" width="44" height="18" rx="3"/><rect x="306" y="196" width="44" height="18" rx="3"/>
      <rect x="150" y="230" width="44" height="18" rx="3"/><rect x="202" y="230" width="44" height="18" rx="3"/>
    </g>
    <circle cx="352" cy="300" r="74" fill="#C9F4FF"/>
    <rect x="312" y="282" width="80" height="36" rx="6" fill="#00A040"/>
    <circle cx="352" cy="300" r="74" fill="none" stroke="#FFB43C" stroke-width="24"/>
    <line x1="406" y1="354" x2="472" y2="420" stroke="#FFB43C" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
