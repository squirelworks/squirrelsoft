  <circle cx="256" cy="256" r="231" fill="none" stroke="#0B1020" stroke-width="30"/>
  <g id="mark">
    <rect x="34" y="104" width="420" height="276" rx="22" fill="#E6F5EC" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="62" y="226" width="50" height="40" rx="8" fill="#00A040"/>
