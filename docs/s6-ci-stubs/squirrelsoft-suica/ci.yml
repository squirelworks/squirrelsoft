# Suggested CI for squirrelsoft-suica (copy to .github/workflows/ci.yml after split).
# Debug only; no AABs; synthetic fixtures only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: make test (sqfelica + SquirrelSuica)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PC/SC / libusb (optional reader backends)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev pcscd vsmartcard-vpcd libusb-1.0-0-dev libsdl2-dev libsdl2-ttf-dev
      - name: Start pcscd with the virtual reader
        run: |
          sudo systemctl stop pcscd.socket pcscd.service || true
          sudo pcscd --disable-polkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make test
        run: |
          make -C libs/sqfelica test
          make -C squirrelsuica test PCSC_TEST_FLAGS=--require

  android:
    name: Android squirrelsuica
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: squirrelsuica/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
