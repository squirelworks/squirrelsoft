# Suggested CI for squirrelsoft-gnss (copy to .github/workflows/ci.yml after split).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: make test (SquirrelGNSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: make test
        run: make -C squirrelgnss test

  android:
    name: Android squirrelgnss
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: squirrelgnss/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
